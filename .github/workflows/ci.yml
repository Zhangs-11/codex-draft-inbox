name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/test_macos_app.sh
      - name: Build and verify Universal Release
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw macos-app/AppResources/Info.plist)
          ./scripts/package_release.sh "$VERSION"
          lipo -archs "$HOME/Library/Caches/CodexDraftInbox/Codex Draft Inbox.app/Contents/MacOS/CodexDraftInbox" | grep -q arm64
          lipo -archs "$HOME/Library/Caches/CodexDraftInbox/Codex Draft Inbox.app/Contents/MacOS/CodexDraftInbox" | grep -q x86_64
          cd dist
          shasum -a 256 -c "Codex-Draft-Inbox-v$VERSION-macos-universal.zip.sha256"
